name: Windows Test Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # 1. JOB: NATIVE MSVC COMPILATION (64-BIT / x64)
  # =========================================================================
  build-msvc-x64:
    name: Windows (MSVC - x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Meson and Ninja
      run: pip install meson ninja

    # Automatically and correctly configures x64 MSVC environment variables
    - name: Initialize MSVC x64 Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build with MSVC (x64)
      run: |
        meson setup build_x64 --buildtype=debugoptimized --backend=ninja
        meson compile -C build_x64

    - name: Pack MSVC x64 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EccEdc-Windows-MSVC-x64
        path: |
          build_x64/*.exe
          build_x64/*.pdb
          README.md

  # =========================================================================
  # 2. JOB: NATIVE MSVC COMPILATION (32-BIT / x86)
  # =========================================================================
  build-msvc-x86:
    name: Windows (MSVC - x86)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Meson and Ninja
      run: pip install meson ninja

    # Automatically and correctly configures x86 (32-bit) MSVC environment variables
    - name: Initialize MSVC x86 Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build with MSVC (x86)
      run: |
        meson setup build_x86 --buildtype=debugoptimized --backend=ninja
        meson compile -C build_x86

    - name: Pack MSVC x86 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EccEdc-Windows-MSVC-x86
        path: |
          build_x86/*.exe
          build_x86/*.pdb
          README.md

  # =========================================================================
  # 3. JOB: CLANG-CL COMPILATION WITH ASAN + UBSAN
  # =========================================================================
  build-clang-cl:
    name: Windows (Clang-CL - x64)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Meson and Ninja
      run: pip install meson ninja

    # Clang-cl still requires Windows SDK headers from the MSVC environment
    - name: Initialize MSVC x64 Environment for Clang
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Fix: We set CC and CXX environment variables using standard shell syntax
    # before running the 'meson setup' command
    - name: Build with Clang-CL (Sanitizers x64)
      shell: cmd
      run: |
        set CC=clang-cl
        set CXX=clang-cl
        meson setup build_clang --buildtype=debugoptimized --backend=ninja
        meson compile -C build_clang

    - name: Pack Clang-CL Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EccEdc-Windows-ClangCL-Sanitizers-x64
        path: |
          build_clang/*.exe
          build_clang/*.pdb
          README.md
