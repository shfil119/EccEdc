name: Build and Pack Assets (MSBuild - Debug Configuration Win32)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # 1. JOB: NATIVE MSVC COMPILATION (32-BIT / Win32 Debug)
  # =========================================================================
  build-msvc-win32:
    name: Windows (MSVC - Win32 Debug)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    # CRITICAL FIX: Explicitly using Platform=Win32 to match the .sln file exactly
    - name: Build with MSVC (Debug Win32)
      run: msbuild EccEdc.sln /p:Configuration=Debug /p:Platform=Win32

    # Packaging artifacts from the root Debug/ folder
    - name: Pack MSVC Win32 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EccEdc-Windows-MSVC-Win32-Debug
        path: |
          Debug/*.exe
          Debug/*.pdb
          README.md

  # =========================================================================
  # 2. JOB: CLANG-CL COMPILATION WITH ASAN + UBSAN (32-BIT / Win32 Debug)
  # =========================================================================
  build-clang-cl-win32:
    name: Windows (Clang-CL - Win32 Debug)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    # CRITICAL FIX: Explicitly using Platform=Win32 and configuring Clang toolset
    - name: Build with Clang-CL (Sanitizers + Debug Win32)
      run: |
        msbuild EccEdc.sln /p:Configuration=Debug /p:Platform=Win32 /p:PlatformToolset=LLVM_v143_clangcl /p:AdditionalOptions="-fsanitize=address -fsanitize=undefined"

    # Packaging artifacts from the root Debug/ folder for Clang
    - name: Pack Clang-CL Win32 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EccEdc-Windows-ClangCL-Sanitizers-Win32-Debug
        path: |
          Debug/*.exe
          Debug/*.pdb
          README.md
