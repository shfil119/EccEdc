name: Build Windows XP App with Meson
on: [push, pull_request]

jobs:
  build-for-xp:
    # 1. Hostem jest nowoczesne i wspierane Ubuntu LTS
    runs-on: ubuntu-24.04

    steps:
      # KROK 1: Pobieramy kod na hoście (Działa w 100% stabilnie)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # KROK 2: Kompilacja w kontenerze Ubuntu 14.04 przy użyciu Dockera.
      # Wszystkie operacje (Apt, Pip, Meson) zamykamy w jednym bloku dockerowym.
      - name: Compile Inside Safe Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ubuntu:14.04 /bin/bash -c "
            echo '=== 2. Install Build Tools ==='
            apt-get update
            apt-get install -y build-essential mingw-w64 python3-pip ninja-build

            echo '=== 3. Install Meson 0.44.1 (Python 3.4 compatible) ==='
            pip3 install 'meson==0.44.1'

            echo '=== 4. Run Meson Setup and Compile ==='
            # Flaga --reconfigure pozwala na czyszczenie katalogu przy ponownych buildach
            meson setup builddir --cross-file cross-mingw.txt -Denable_xp_compat=true
            meson compile -C builddir
          "

      # KROK 3: Zapisanie pliku .exe (Wykonuje się na hoście z folderu builddir)
      - name: Upload Windows XP Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-xp-meson-binary
          path: builddir/*.exe
