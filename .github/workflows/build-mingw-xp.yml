name: Build Windows XP App with Meson
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-for-xp:
    # 1. Hostem jest nowoczesne i wspierane Ubuntu LTS
    runs-on: ubuntu-24.04

    steps:
      # KROK 1: Pobieramy kod na hoście (Działa w 100% stabilnie)
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # KROK 2: Kompilacja w kontenerze Ubuntu 14.04 przy użyciu Dockera.
      - name: Compile Inside Safe Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work ubuntu:14.04 /bin/bash -c "

            echo '=== 2. Configure UTF-8 Locale ==='
            apt-get update
            apt-get install -y locales
            locale-gen en_US.UTF-8
            export LANG=en_US.UTF-8
            export LC_ALL=en_US.UTF-8

            echo '=== 3. Install Core Build Tools ==='
            # Instalujemy podstawy (unzip i wget będą potrzebne do pobrania nowej wersji Ninja)
            apt-get install -y build-essential mingw-w64 python3-pip git wget unzip

            echo '=== 4. Download and Install Modern Ninja (v1.11.1) ==='
            # Pobieramy oficjalne binarne wydanie Ninja, które bez problemu działa na Ubuntu 14.04
            wget https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip
            unzip ninja-linux.zip -d /usr/local/bin/
            chmod +x /usr/local/bin/ninja

            # Weryfikacja wersji (zwróci 1.11.1, co w pełni zadowoli Mesona)
            ninja --version

            echo '=== 5. Install Meson 0.44.1 ==='
            pip3 install 'meson==0.44.1'

            echo '=== 6. Run Meson Setup ==='
            # Teraz konfiguracja przejdzie pomyślnie, bo wykryje Ninja 1.11.1
            meson setup builddir --cross-file mingw-cross.txt -Denable_xp_compat=true

            echo '=== 7. Compile Using Native Ninja ==='
            ninja -C builddir
          "

      # KROK 3: Zapisanie pliku .exe (Wykonuje się na hoście z folderu builddir)
      - name: Upload Windows XP Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-xp-meson-binary
          path: builddir/*.exe
