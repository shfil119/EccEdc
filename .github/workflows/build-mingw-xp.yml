name: Build for Windows XP

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-for-xp:
    # Using a specific Ubuntu LTS release version instead of 'latest' to guarantee reproducibility
    runs-on: ubuntu-24.04

    # Isolate the compilation inside a legacy container to guarantee std::thread support for XP
    container:
      image: ubuntu:14.04

    steps:

      # STEP 2: Install MinGW cross-compiler, Python 3, and Pip (required by Meson)
      - name: Install Build Tools and Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential mingw-w64 git python3-pip ninja-build

      # STEP 3: Install a legacy version of Meson compatible with Python 3.4
      - name: Install Meson Build System
        run: |
          pip3 install 'meson==0.44.1'
          meson --version

      # STEP 4: Pull the source code from your repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # STEP 5: Configure and build the project using Meson cross-compilation
      - name: Configure and Build with Meson
        run: |
          meson setup builddir -Denable_xp_compat=true --cross-file cross-mingw.txt --buildtype=debugoptimized
          meson compile -C builddir

      # STEP 6: Save the generated executable as a downloadable GitHub artifact
      - name: Upload Windows XP Binary
        uses: actions/upload-artifact@v4
        with:
          name: windows-xp-meson-binary
          path: |
            builddir/*.exe
            README.md
